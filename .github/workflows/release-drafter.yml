name: Release Drafter and Labels

# mithro/gplugins fork (for gf180-tcad, https://github.com/mithro/gf180-tcad):
# disabled. It needs write tokens and writes to the repository:
# - update_release_draft creates/edits a draft GitHub release (contents: write),
#   i.e. it prepares a release, and the fork never releases;
# - require_label comments on PRs and fails every PR without an upstream
#   release label.
# The automatic triggers are removed and every job is guarded with `if: false`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    # Disabled in the fork (see the note at the top).
    if: ${{ false }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  require_label:
    # Disabled in the fork (see the note at the top).
    if: ${{ false }}
    needs: update_release_draft
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: "breaking, bug, github_actions, documentation, dependencies, enhancement, feature, maintenance, security"
          add_comment: true
