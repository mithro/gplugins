name: Test code
# mithro/gplugins fork (for gf180-tcad, https://github.com/mithro/gf180-tcad):
# this is the fork's PR/main test workflow. It runs on GitHub-hosted runners
# and passes no secrets or tokens to any step. gplugins/devsim is not in the matrix: the
# test_devsim job runs it inside the pinned gf180-tcad TCAD image instead.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1

  test_code:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        plugin: [emode, femwell, meow, sax, tidy3d, klayout, vlsir, path_length_analysis, elmer, ansys, comsol]
        os: [ubuntu-latest]
        python-version: [3.12]
        exclude:
          - plugin: femwell
            os: macos-latest
          - plugin: femwell
            os: windows-latest
          - plugin: sax
            python-version: 3.13

    name: Test ${{ matrix.plugin }} ${{ matrix.os }} ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        run: |
          uv venv -p ${{ matrix.python-version }}
          uv pip install .[${{ matrix.plugin }},dev] setuptools
          make test-data
      - name: Test with pytest
        run: |
          uv run pytest gplugins/${{ matrix.plugin }}
      - name: Test capacitance wrapper
        if: ${{ matrix.plugin == 'elmer' }}
        run: uv run pytest gplugins/common/utils/tests/test_get_capacitance.py

  test_devsim:
    # gplugins.devsim runs inside the pinned gf180-tcad TCAD image (devsim 2.11.1,
    # gdsfactory 9.51.0, meshwell 2.5.2, gmsh 4.15.2, Python 3.13), so this job uses exactly
    # gf180-tcad's locked environment and resolves no packages. The digest is gf180-tcad's
    # docker/TCAD_IMAGE, and the `docker run` settings reproduce gf180-tcad tools/sandbox-run
    # (lines 101-125), both at gf180-tcad commit 3c386f95ff2955be6367bd5ec7c66298b812a4fe.
    # Left out: the gf180-tcad.slice cgroup parent and the --memory/--cpus/--pids-limit limits
    # (host resource guards; --cpus 8 exceeds a hosted runner's 4 CPUs), and the read-only
    # gf180-tcad mount at /work/src. PYTHON_CPU_COUNT=1 comes from the image.
    runs-on: ubuntu-latest
    name: Test devsim (gf180-tcad TCAD image)
    env:
      TCAD_IMAGE: ghcr.io/mithro/gf180-tcad-tcad@sha256:5d8a681220fed79000f0aeecd0aa979452d919decdd3e7604cc17415a733e9a8
    steps:
      - name: Free disk space
        # the image is ~15 GB unpacked
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pull the TCAD image by digest
        run: |
          docker pull --quiet "$TCAD_IMAGE"
          docker image inspect "$TCAD_IMAGE" --format 'id={{.Id}} size={{.Size}}'
          df -h /
      - name: Test with pytest
        run: |
          docker run --rm \
            --entrypoint "" \
            --cap-drop ALL --security-opt no-new-privileges \
            --network none \
            --read-only --tmpfs /tmp:rw,size=1g,exec \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e USER=gf180tcad -e LOGNAME=gf180tcad -e PYTHONPATH=/work/out \
            -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -e "NPY_DISABLE_CPU_FEATURES=X86_V3 X86_V4 AVX512_ICL AVX512_SPR" \
            -e GF180TCAD_IN_SANDBOX=1 \
            -v "$GITHUB_WORKSPACE:/work/out:rw" --workdir /work/out \
            "$TCAD_IMAGE" \
            sh -c 'mkdir -p "$HOME" && exec "$@"' -- \
            python -m pytest -p no:cacheprovider gplugins/devsim -m "not tidy3d" -v

  test_meep:
    runs-on: ubuntu-latest
    name: Test meep ubuntu-latest 3.11
    steps:
      - uses: actions/checkout@v7
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: 3.11
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda create -n mp python=3.11 -y
          conda activate mp
          conda install -c conda-forge pymeep pymeep-extras gdsfactory -y
          pip install .[meep,dev] setuptools
          pip install "numpy<2.0"
          make test-data
      - name: Test with pytest
        shell: bash -l {0}
        run: |
          conda activate mp
          pytest gplugins/gmeep

  test_palace:
    # Disabled in the mithro/gplugins fork: Palace (a full-wave EM solver) is irrelevant to
    # gf180-tcad, and on a cold cache this job builds the Palace container from source for up to
    # an hour on every PR. Upstream already marks it continue-on-error (it is not a reliable gate).
    if: ${{ false }}
    runs-on: ubuntu-latest
    name: Test palace ubuntu-latest 3.11
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Setup Apptainer
        uses: eWaterCycle/setup-apptainer@3f706d898c9db585b1d741b4692e66755f3a1b40
        with:
          apptainer-version: 1.4.2
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Download Palace singularity definition
        run: wget https://raw.githubusercontent.com/awslabs/palace/refs/tags/v0.16.0/singularity/singularity.def # Newer versions of palace have deprecated singularity definitions, so we pin to a specific version. TODO: Update this
      - name: Cache Palace container restore
        id: cache-palace-restore
        uses: actions/cache/restore@v6
        with:
          path: palace.sif
          key: palace-container-${{ runner.os }}-${{ hashFiles('singularity.def') }}
      - name: Build palace from source
        if: steps.cache-palace-restore.outputs.cache-hit != 'true'
        run: |
          echo "Building Palace container from source (this may take a while)…"
          echo "Note: This is a one-time build that will be cached for future runs"
          timeout 3600 sudo apptainer build palace.sif singularity.def || {
            echo "Build timed out or failed after 60 minutes. Palace tests will be skipped."
            exit 1
          }
      - name: Cache Palace container save
        uses: actions/cache/save@v6
        if: steps.cache-palace-restore.outputs.cache-hit != 'true'
        with:
          path: palace.sif
          key: palace-container-${{ runner.os }}-${{ hashFiles('singularity.def') }}
      - name: Create palace alias
        run: |
          # Create a shell script that acts as an alias for palace
          echo '#!/bin/bash' > palace
          echo "sudo apptainer run $GITHUB_WORKSPACE/palace.sif \"\$@\" " >> palace
          chmod +x palace
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH
          echo "Palace executable created successfully"
      - name: Verify Palace installation
        run: |
          palace --help || echo "Palace help failed but container exists"
      - name: Test with pytest
        run: sudo env "PATH=$PATH" "$(which uv)" run --extra dev --extra meshwell pytest gplugins/palace -v

  test_code_coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install libglu1-mesa
        run: |
          sudo apt-get install -y libglu1-mesa
      - name: Install dependencies
        run: |
          make install test-data
      - name: Test with pytest
        run: |
          make cov
      # mithro/gplugins fork: the Codecov upload is removed. It used the
      # upstream CODECOV_TOKEN secret and publishes coverage to codecov.io.
