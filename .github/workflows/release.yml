name: Release package

# mithro/gplugins fork (for gf180-tcad, https://github.com/mithro/gf180-tcad):
# disabled. This workflow publishes the package to PyPI with the upstream
# PYPI_USERNAME/PYPI_PASSWORD secrets and publishes GitHub releases. The fork
# never releases or publishes anything, so the tag trigger is removed and
# every job is guarded with `if: false`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release_pypi:
    # Disabled in the fork: publishes (see the note at the top).
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine
      - name: Build and publish
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          make build
          twine upload dist/*

  release_environment:
    # Disabled in the fork: publishes (see the note at the top).
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish Latest Draft
        run: |
          gh release edit ${{ github.ref_name }} --draft=false
          gh release upload ${{ github.ref_name }} uv.lock --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
