# Configuration for lychee link checker
# https://github.com/lycheeverse/lychee

# Exclude URLs that are known false positives
exclude = [
  # Template variable placeholders used in release-drafter and changelogs
  ".*\\$OWNER.*",
  ".*\\$REPOSITORY.*",
  ".*\\$NUMBER.*",
  ".*\\$PREVIOUS_TAG.*",
  ".*\\$RESOLVED_VERSION.*",
  ".*\\{issue\\}.*",
  ".*\\{version\\}.*",
  ".*%7Bissue%7D.*",
  ".*%7Bversion%7D.*",
  # Login-walled or auth-required
  "https://join.slack.com/.*",
  "https://drive.google.com/.*",
  # Rate-limited or returns 403/5xx transiently
  "https://www.ioffe.ru/.*",
  "http://www.ioffe.ru/.*",
  "https://link.aps.org/.*",
  "https://www.elmerfem.org/.*",
  "https://www.lumerical.com/.*",
  "https://support.lumerical.com/.*",
  "https://optics.ansys.com/.*",
  # IEEE blocks automated crawlers with 418
  "https://ieeexplore.ieee.org/.*",
  # Consistently returns non-200 despite valid content
  "https://mathworld.wolfram.com/.*",
  "https://nbviewer.org/.*",
  "http://urn.fi/.*",
  "https://raw.githubusercontent.com/polyanskiy/.*",
  # Broken or renamed upstream links
  "https://github.com/simbilod/.*",
  # Notebook-embedded URLs that include trailing newlines or path issues
  "https://jupyterbook.org/.*",
  "https://pyswarms.readthedocs.io/.*",
  "https://docs.ray.io/.*",
  "https://awslabs.github.io/palace/.*",
  # PyPI file downloads in uv.lock return transient 503s
  "https://files.pythonhosted.org/.*",
  # refractiveindex.info returns 404 transiently
  "https://refractiveindex.info/.*",
  # Upstream docs that have moved or been restructured
  "https://meep.readthedocs.io/.*",
  "https://gdsfactory.github.io/gdsfactory/.*",
  # PeerTube instance has an expired TLS certificate
  "https://peertube.f-si.org/.*",
  # Optica blocks automated crawlers; DOIs in the 10.1364 prefix redirect there
  "https://opg.optica.org/.*",
  "https://doi.org/10.1364/.*",
  # Wiley and AIP Publishing answer automated crawlers with 403; these DOIs (physics
  # citations in gplugins/devsim/constants.py) redirect there
  "https://doi.org/10.1002/0470068329",
  "https://doi.org/10.1063/1.1529297",
  "https://doi.org/10.1063/1.354551",
  # srim.org is intermittently unreachable and times out
  "http://www.srim.org/.*",
  # www.paraview.org times out (2026-10-19: from GitHub runners and other hosts alike);
  # linked from notebooks/devsim_01_pin_waveguide.ipynb
  "https://www.paraview.org/.*"
]
